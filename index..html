const LST={"證件":["護照","機票／電子登機證","Visit Japan Web","網路卡或漫遊"],"衣物":["保暖外套","發熱衣","手套、圍巾、帽子","防滑鞋","和服日換穿球鞋"],"電子":["相機與記憶卡","行動電源、充電線","日本轉接頭"],"盥洗":["盥洗用品","保養品","常備藥品"],"出發前確認":["餐廳訂位（牛丸、炭櫓、焼肉）","和服預約與攝影師","神戶住宿資料","天氣預報"]};
// ===== 以下為功能程式 =====
function note(t){const m=$("#msg");m.textContent=t;m.style.display="block";setTimeout(()=>m.style.display="none",3000)}
const $=s=>document.querySelector(s),E=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){note("儲存空間已滿，無法儲存");return false}};
const gm=q=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);
const TABS={home:"首頁",plan:"每日行程",budget:"花費記錄",list:"清單",weather:"天氣"};
function show(id){if(!TABS[id])id="home";document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id==id));[...$("#nav").children].forEach(b=>b.classList.toggle("on",b.dataset.t==id));scrollTo(0,0);try{history.replaceState(null,"","#"+id)}catch(e){}}
for(const k in TABS){const b=E("button","",TABS[k]);b.dataset.t=k;b.onclick=()=>show(k);$("#nav").append(b)}
let cur=0;
function showDay(i){cur=i;[...$("#chips").children].forEach((c,j)=>c.classList.toggle("on",j==i));const D=DAYS[i],box=$("#day");box.innerHTML="";
const h=E("div","card");h.append(E("div","tm","DAY "+(i+1)+"　"+D.d),E("h2","",D.t),E("div","nt","住宿："+D.stay));
const rt=E("a","btn","當日路線（Google Maps 大眾運輸）");const pts=D.items.map(x=>x[3]);rt.href="https://www.google.com/maps/dir/"+pts.filter((p,j)=>j==0||p!=pts[j-1]).map(encodeURIComponent).join("/");rt.target="_blank";rt.rel="noopener";h.append(rt);box.append(h);
const tl=E("div","tl");D.items.forEach((x,j)=>{const it=E("div","it"+(x[4]?" r":""));it.append(E("div","tm",x[0]),E("h3","",x[1]));if(x[2])it.append(E("div","nt",x[2]));
if(x[4])it.append(x[5]?E("div","nt","🕐 "+x[5]):E("div","warn","營業時間／公休／價格：待確認"));
const r=E("div","row"),a=E("a","btn","導航 / 地圖");a.href=gm(x[3]);a.target="_blank";a.rel="noopener";r.append(a);
if(j>0){const b=E("a","btn","從上一站怎麼去");b.href="https://www.google.com/maps/dir/?api=1&travelmode=transit&origin="+encodeURIComponent(D.items[j-1][3])+"&destination="+encodeURIComponent(x[3]);b.target="_blank";b.rel="noopener";r.append(b)}
it.append(r);tl.append(it)});box.append(tl);
box.append(E("div","card","注意：冬季早晚氣溫低，預留保暖與雨具；天氣請見「天氣」頁。"))}
DAYS.forEach((D,i)=>{const c=E("button","chip","DAY "+(i+1)+" "+D.d.slice(0,5));c.onclick=()=>showDay(i);$("#chips").append(c);const q=E("a","chip","DAY "+(i+1)+"｜"+D.d.slice(0,5));q.href="#plan";q.onclick=e=>{e.preventDefault();show("plan");showDay(i)};$("#qn").append(q)});showDay(0);
FLAGS.forEach(f=>$("#flags").append(E("div","warn","⚠ "+f)));
$("#cd").textContent=(n=>n>0?n+" 天後出發":n>-7?"旅行中":"已結束")(Math.ceil((new Date("2026-12-14T00:00:00+09:00")-Date.now())/864e5));
// 預算
let ed=-1,cf=-1;
let B=ld("bud",{rate:.21,bud:100000,p:["爸媽","自己"],x:[]});
const fm=n=>Math.round(n).toLocaleString();
function rb(){["#cat","#who"].forEach(s=>$(s).innerHTML="");CATS.forEach(c=>$("#cat").append(new Option(c)));B.p.forEach((p,i)=>$("#who").append(new Option(p,i)));
$("#rate").value=B.rate;$("#p1").value=B.p[0];$("#p2").value=B.p[1];
const tw=x=>x.cu=="JPY"?x.am*B.rate:x.am,tot=B.x.reduce((s,x)=>s+tw(x),0),pp=[0,1].map(i=>B.x.filter(x=>x.w==i).reduce((s,x)=>s+tw(x),0));
const bc={};B.x.forEach(x=>bc[x.c]=(bc[x.c]||0)+tw(x));
$("#sum").innerHTML="";const jp=B.x.filter(x=>x.cu=="JPY").reduce((a,x)=>a+x.am,0);[["總花費（台幣）","NT$ "+fm(tot)],["其中日幣支出","¥ "+fm(jp)],[B.p[0]+" 出的","NT$ "+fm(pp[0])],[B.p[1]+" 出的","NT$ "+fm(pp[1])]].forEach(r=>$("#sum").append(E("div","row",r[0]+"：　"+r[1])));
$("#sum").append(E("div","nt","分類："+(Object.entries(bc).map(e=>e[0]+" "+fm(e[1])).join("、")||"尚無")));
const tb=$("#tb");tb.innerHTML="";B.x.forEach((x,i)=>{const tr=E("tr"),t=E("td");
if(i===ed){const c=E("select"),d=E("input"),a=E("input"),u=E("select"),w=E("select");CATS.forEach(k=>c.append(new Option(k)));c.value=x.c;d.value=x.d;a.type="number";a.value=x.am;["JPY","TWD"].forEach(k=>u.append(new Option(k)));u.value=x.cu;B.p.forEach((p,j)=>w.append(new Option(p,j)));w.value=x.w;[c,d,a,u,w].forEach(el=>{const td=E("td");td.append(el);tr.append(td)});
const ok=E("button","x","儲存"),no=E("button","x","取消");ok.onclick=()=>{const v=+a.value;if(!v)return note("請輸入金額");Object.assign(x,{c:c.value,d:d.value,am:v,cu:u.value,w:+w.value});ed=-1;sv("bud",B);rb()};no.onclick=()=>{ed=-1;rb()};t.append(ok,no)}
else{[x.c,x.d,(x.cu=="JPY"?"¥":"NT$")+fm(x.am),"≈NT$"+fm(tw(x)),B.p[x.w]].forEach(v=>tr.append(E("td","",v)));const e=E("button","x","改"),r=E("button","x",i===cf?"確定刪除？":"刪");e.onclick=()=>{ed=i;cf=-1;rb()};r.onclick=()=>{if(cf===i){B.x.splice(i,1);cf=-1;sv("bud",B)}else cf=i;rb()};t.append(e,r)}
tr.append(t);tb.append(tr)})}
$("#add").onclick=()=>{const a=+$("#am").value;if(!a)return note("請輸入金額");B.x.push({c:$("#cat").value,d:$("#ds").value,am:a,cu:$("#cu").value,w:+$("#who").value});$("#am").value=$("#ds").value="";sv("bud",B);rb()};
$("#rate").onchange=()=>{B.rate=+$("#rate").value||B.rate;sv("bud",B);rb()};
$("#p1").onchange=$("#p2").onchange=()=>{B.p=[$("#p1").value||"爸媽",$("#p2").value||"自己"];sv("bud",B);rb()};rb();
// 清單
let L=ld("ck",null);if(!L){L=[];for(const g in LST)LST[g].forEach(t=>L.push({g,t,k:0}))}
Object.keys(LST).forEach(g=>$("#ng").append(new Option(g)));
function rl(){const b=$("#ls");b.innerHTML="";const gs=[...new Set(L.map(x=>x.g))];gs.forEach(g=>{const c=E("div","card");c.append(E("h3","",g));L.forEach((x,i)=>{if(x.g!=g)return;const r=E("div","row"),k=E("input");k.type="checkbox";k.checked=!!x.k;k.onchange=()=>{x.k=k.checked;sv("ck",L);rl()};const t=E("span","",x.t);if(x.k)t.style.textDecoration="line-through";const d=E("button","x","✕");d.onclick=()=>{L.splice(i,1);sv("ck",L);rl()};r.append(k,t,d);c.append(r)});b.append(c)})}
$("#na").onclick=()=>{const t=$("#ni").value.trim();if(!t)return;L.push({g:$("#ng").value,t,k:0});$("#ni").value="";sv("ck",L);rl()};rl();
// 天氣
[["大阪","Osaka"],["京都","Kyoto"],["神戶","Kobe"],["箕面（勝尾寺）","Minoh Osaka"]].forEach(([n,q])=>{const c=E("div","card");c.append(E("h3","",n));const r=E("div","row");[["Google 天氣","https://www.google.com/search?q="+encodeURIComponent(q+" weather")],["氣象廳預報與警報","https://www.jma.go.jp/bosai/forecast/"],["Windy 風速／降雪","https://www.windy.com/?"+encodeURIComponent(q)]].forEach(([t,u])=>{const a=E("a","btn",t);a.href=u;a.target="_blank";a.rel="noopener";r.append(a)});c.append(r);$("#wl").append(c)});
show((location.hash||"#home").slice(1));addEventListener("hashchange",()=>show(location.hash.slice(1)));
</script></body></html>
